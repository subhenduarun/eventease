<!DOCTYPE html>
<html>
<head>
  <title>All Bookings</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-image: url("../static/wedding.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #333;
      margin: 0;
      padding: 0;
    }
    h2 {
      margin-top: 40px;
      color: #fff;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.6);
    }
    table {
      margin: 40px auto;
      border-collapse: collapse;
      width: 80%;
      background-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      font-size: 16px;
    }
    th {
      background-color: #f2f2f2;
    }
    a.button {
      padding: 6px 12px;
      background-color: #007BFF;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      margin: 0 4px;
      font-size: 14px;
    }
    a.button.delete {
      background-color: #dc3545;
    }
    a.button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h2>All Bookings</h2>
  <a href="/book" class="button">New Booking</a>
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Event Type</th>
      <th>Actions</th>
    </tr>
    {% for booking in bookings %}
    <tr>
      <td>{{ booking.id }}</td>
      <td>{{ booking.name }}</td>
      <td>{{ booking.event_type }}</td>
      <td>
        <a href="/edit/{{ booking.id }}" class="button">Edit</a>
        <a href="/delete/{{ booking.id }}" class="button delete">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>

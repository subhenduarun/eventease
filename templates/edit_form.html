<!DOCTYPE html>
<html>
<head>
  <title>Edit Booking</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url("../static/wedding.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      text-align: center;
      color: #333;
    }
    form {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 20px;
      margin: 80px auto;
      width: 400px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    input, button {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
    }
    button {
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>Edit Booking</h2>
  <form method="POST">
    <input type="text" name="name" value="{{ booking.name }}" required>
    <input type="text" name="event" value="{{ booking.event_type }}" required>
    <button type="submit">Update Booking</button>
  </form>
</body>
</html>
